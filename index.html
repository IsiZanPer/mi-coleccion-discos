<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi colección</title>
<style>
  :root{
    --bg:#14151a;
    --panel:#1c1e26;
    --panel-hi:#21242e;
    --border:#2c2f3a;
    --text:#ece9e2;
    --muted:#8c8fa0;
    --accent:#c99a3c;
    --accent-dim:#8a6d2c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:14px;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  h1,h2,h3,.serif{
    font-family:Fraunces,Georgia,serif;
    font-weight:600;
  }

  /* ---------- Barra superior ---------- */
  header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 20px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    flex-shrink:0;
  }
  header h1{
    font-size:20px;
    margin:0;
    color:var(--accent);
    white-space:nowrap;
  }
  #buscador{
    flex:1;
    max-width:420px;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 12px;
    border-radius:4px;
    font-size:14px;
  }
  #buscador:focus{outline:none;border-color:var(--accent);}
  #contador{color:var(--muted);white-space:nowrap;}
  #estado-carga{color:var(--muted);font-size:13px;}

  /* ---------- Cuerpo: 3 columnas ---------- */
  #cuerpo{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* --- Sidebar artistas --- */
  #sidebar{
    width:220px;
    flex-shrink:0;
    border-right:1px solid var(--border);
    background:var(--panel);
    overflow-y:auto;
    padding:8px 0;
  }
  .artista-item{
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding:6px 16px;
    cursor:pointer;
    color:var(--muted);
  }
  .artista-item:hover{background:var(--panel-hi);color:var(--text);}
  .artista-item.activo{background:var(--panel-hi);color:var(--accent);font-weight:600;}
  .artista-item .n{opacity:.6;font-variant-numeric:tabular-nums;}

  /* --- Grid álbumes --- */
  #grid-wrap{
    flex:1;
    overflow-y:auto;
    padding:20px;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:18px;
  }
  .album-card{
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .cover{
    width:100%;
    aspect-ratio:1/1;
    background:var(--panel-hi) linear-gradient(135deg,#2a2d38,#1a1c23);
    border:1px solid var(--border);
    border-radius:4px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:11px;
    text-align:center;
    padding:8px;
  }
  .cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .album-card.selec .cover{outline:2px solid var(--accent);outline-offset:2px;}
  .album-titulo{font-size:13px;font-weight:600;line-height:1.3;}
  .album-artista{font-size:12px;color:var(--muted);}

  #vacio{color:var(--muted);padding:40px;text-align:center;}

  /* --- Panel detalle --- */
  #detalle{
    width:520px;
    flex-shrink:0;
    border-left:1px solid var(--border);
    background:var(--panel);
    overflow-y:auto;
    padding:24px;
    display:none;
  }
  #detalle.abierto{display:block;}
  .cerrar-detalle{
    float:right;
    cursor:pointer;
    color:var(--muted);
    font-size:20px;
    line-height:1;
  }
  .cerrar-detalle:hover{color:var(--text);}
  #detalle .cerrar-detalle{position:relative;top:0;}

  #detalle h2{font-size:23px;margin:16px 0 2px;line-height:1.2;}
  #detalle .artista-det{color:var(--accent);font-size:14px;margin-bottom:16px;}

  .det-cabecera{display:flex;gap:16px;margin-bottom:8px;}
  .cover-mediana{
    width:130px;height:130px;flex-shrink:0;
    background:var(--panel-hi) linear-gradient(135deg,#2a2d38,#1a1c23);
    border:1px solid var(--border);
    border-radius:4px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    color:var(--muted);font-family:Fraunces,Georgia,serif;font-size:12px;text-align:center;padding:6px;
  }
  .cover-mediana img{width:100%;height:100%;object-fit:cover;}

  .det-info-top{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0;}
  .det-sello-anio{font-size:15px;font-weight:600;color:var(--text);}
  .det-genero{font-size:13px;color:var(--muted);}
  .det-badges{display:flex;gap:8px;margin:4px 0 2px;}
  .badge-id, .badge-rating{
    display:inline-flex;align-items:center;gap:5px;
    background:var(--panel-hi);
    border:1px solid var(--border);
    padding:4px 10px;
    border-radius:5px;
    font-size:12.5px;
    font-weight:600;
  }
  .badge-rating{color:#e6c84b;}
  .det-catalogo{font-size:12.5px;color:var(--muted);}
  .det-resumen{font-size:12.5px;color:var(--muted);margin-top:2px;}

  .det-subtitulo{
    font-size:13px;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--accent);
    margin:22px 0 8px;
    font-family:Inter,system-ui,sans-serif;
    font-weight:600;
  }

  #canciones{list-style:none;margin:0 0 16px;padding:0;border-radius:4px;overflow:hidden;}
  #canciones li{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:8px;
    padding:9px 12px;
    font-size:14px;
  }
  #canciones li:nth-child(odd){background:var(--panel-hi);}
  #canciones .num{color:var(--muted);width:20px;flex-shrink:0;}
  #canciones .tit{flex:1;font-weight:500;}
  #canciones .dur{color:var(--muted);font-variant-numeric:tabular-nums;font-size:13px;}
  .btn-letra{
    background:transparent;
    border:1px solid var(--border);
    color:var(--muted);
    padding:3px 9px;
    border-radius:4px;
    cursor:pointer;
    font-size:11.5px;
    font-family:inherit;
    flex-shrink:0;
  }
  .btn-letra:hover{border-color:var(--accent);color:var(--accent);}

  .det-particulares{font-size:13.5px;color:var(--muted);line-height:2;}
  .det-particulares b{color:var(--text);font-weight:500;}
  .det-particulares .vacio{opacity:.5;}

  .btn-ficha{
    display:inline-block;
    background:transparent;
    border:1px solid var(--accent-dim);
    color:var(--accent);
    padding:8px 14px;
    border-radius:4px;
    cursor:pointer;
    font-size:13px;
    font-family:inherit;
  }
  .btn-ficha:hover{background:var(--accent);color:#14151a;}

  /* --- Modal ficha (comentario en modo lectura) --- */
  #modal-fondo, #modal-fondo-letra{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.6);
    z-index:50;
    align-items:center;
    justify-content:center;
  }
  #modal-fondo.abierto, #modal-fondo-letra.abierto{display:flex;}
  #modal-ficha{
    background-color:#1b1a15;
    background-image:linear-gradient(#1c1b16,#1c1b16);
    color:#e9e4d8;
    width:min(860px,92vw);
    max-height:85vh;
    overflow-y:auto;
    padding:44px 52px;
    border-radius:6px;
    font-family:Fraunces,Georgia,serif;
    font-size:17px;
    line-height:1.75;
  }
  #modal-ficha h3{margin-top:0;font-size:26px;}
  #modal-ficha img{max-width:100%;border-radius:4px;margin:12px 0;}
  #modal-ficha .cerrar-detalle{color:#8c8776;}

  #modal-letra{
    background-color:#16171e;
    background-image:linear-gradient(#1a1c24,#1a1c24);
    color:var(--text);
    width:min(960px,94vw);
    max-height:85vh;
    overflow-y:auto;
    padding:44px 56px;
    border-radius:6px;
    font-family:Fraunces,Georgia,serif;
    font-size:17px;
    line-height:2;
    white-space:pre-wrap;
  }
  #modal-letra h3{margin-top:0;font-size:24px;color:var(--accent);font-family:Fraunces,Georgia,serif;}
  #modal-letra .subtitulo{color:var(--muted);font-family:Inter,system-ui,sans-serif;font-size:13px;margin:-12px 0 20px;}
  #modal-letra .cerrar-detalle{color:var(--muted);}

  /* Scrollbars discretas */
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:820px){
    #sidebar{position:fixed;left:0;top:53px;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .2s;}
    #sidebar.abierto{transform:translateX(0);}
    #detalle{position:fixed;right:0;top:53px;bottom:0;width:100%;z-index:30;}
  }
</style>
</head>
<body>

<header>
  <h1>Mi colección</h1>
  <input id="buscador" type="text" placeholder="Buscar por álbum o artista…">
  <span id="contador"></span>
  <span id="estado-carga">Cargando datos…</span>
</header>

<div id="cuerpo">
  <nav id="sidebar">
    <div class="artista-item activo" data-artista="__TODOS__">
      <span>Todos</span><span class="n" id="n-todos"></span>
    </div>
    <div id="lista-artistas"></div>
  </nav>

  <div id="grid-wrap">
    <div id="grid"></div>
    <div id="vacio" style="display:none;">No se han encontrado álbumes.</div>
  </div>

  <aside id="detalle">
    <span class="cerrar-detalle" id="cerrar-detalle">✕</span>

    <div class="det-cabecera">
      <div class="cover-mediana" id="det-cover"></div>
      <div class="det-info-top">
        <div class="det-sello-anio" id="det-sello-anio"></div>
        <div class="det-genero" id="det-genero"></div>
        <div class="det-badges" id="det-badges"></div>
        <div class="det-catalogo" id="det-catalogo"></div>
        <div class="det-resumen" id="det-resumen"></div>
      </div>
    </div>

    <h2 id="det-titulo"></h2>
    <div class="artista-det" id="det-artista"></div>

    <div class="det-subtitulo">Canciones</div>
    <ol id="canciones"></ol>
    <button class="btn-ficha" id="btn-ficha">Ver ficha completa</button>

    <div class="det-subtitulo">Detalles particulares</div>
    <div class="det-particulares" id="det-particulares"></div>
  </aside>
</div>

<div id="modal-fondo">
  <div id="modal-ficha">
    <span class="cerrar-detalle" id="cerrar-modal">✕</span>
    <h3 id="modal-titulo"></h3>
    <div id="modal-cuerpo"></div>
  </div>
</div>

<div id="modal-fondo-letra">
  <div id="modal-letra">
    <span class="cerrar-detalle" id="cerrar-modal-letra">✕</span>
    <h3 id="letra-titulo"></h3>
    <div class="subtitulo" id="letra-subtitulo"></div>
    <div id="letra-cuerpo"></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURACIÓN — pega aquí la URL /exec de tu Apps Script
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbwjBPSQzS1HUC4fAl21wSonBf2qe5iNHLi8n-JVyQCt6VISRDpV-_VcUZM-se_Zabg2/exec";

let ALBUMES = [];
let CANCIONES = [];
let artistaActivo = "__TODOS__";
let albumSeleccionado = null;

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

/* ---------- Carga de datos ---------- */
async function cargarDatos(){
  try{
    const res = await fetch(API_URL);
    const json = await res.json();
    if(!json.ok){
      $("#estado-carga").textContent = "Error: " + json.error;
      return;
    }
    ALBUMES = json.albumes;
    CANCIONES = json.canciones;
    $("#estado-carga").textContent = "";
    construirSidebar();
    pintarGrid();
  }catch(err){
    $("#estado-carga").textContent = "No se pudo conectar con la hoja de datos.";
    console.error(err);
  }
}

/* ---------- Sidebar de artistas ---------- */
function construirSidebar(){
  const conteo = {};
  ALBUMES.forEach(a=>{
    const nombre = (a["ARTISTA ALBUM"]||"(Sin artista)").trim();
    conteo[nombre] = (conteo[nombre]||0)+1;
  });
  const artistas = Object.keys(conteo).sort((a,b)=>a.localeCompare(b,'es'));

  $("#n-todos").textContent = ALBUMES.length;

  const cont = $("#lista-artistas");
  cont.innerHTML = "";
  artistas.forEach(nombre=>{
    const div = document.createElement("div");
    div.className = "artista-item";
    div.dataset.artista = nombre;
    div.innerHTML = `<span>${escapeHTML(nombre)}</span><span class="n">${conteo[nombre]}</span>`;
    div.addEventListener("click", ()=>{
      artistaActivo = nombre;
      $$(".artista-item").forEach(el=>el.classList.remove("activo"));
      div.classList.add("activo");
      pintarGrid();
    });
    cont.appendChild(div);
  });

  $('.artista-item[data-artista="__TODOS__"]').addEventListener("click", ()=>{
    artistaActivo = "__TODOS__";
    $$(".artista-item").forEach(el=>el.classList.remove("activo"));
    $('.artista-item[data-artista="__TODOS__"]').classList.add("activo");
    pintarGrid();
  });
}

/* ---------- Grid de álbumes ---------- */
function pintarGrid(){
  const texto = $("#buscador").value.trim().toLowerCase();

  let lista = ALBUMES.filter(a=>{
    const okArtista = artistaActivo === "__TODOS__" || (a["ARTISTA ALBUM"]||"").trim() === artistaActivo;
    if(!okArtista) return false;
    if(!texto) return true;
    const campo = ((a["ALBUM"]||"") + " " + (a["ARTISTA ALBUM"]||"")).toLowerCase();
    return campo.includes(texto);
  });

  lista.sort((a,b)=> (a["ALBUM"]||"").localeCompare(b["ALBUM"]||"", 'es'));

  $("#contador").textContent = lista.length + (lista.length===1 ? " álbum" : " álbumes");

  const grid = $("#grid");
  grid.innerHTML = "";
  $("#vacio").style.display = lista.length ? "none" : "block";

  lista.forEach(a=>{
    const card = document.createElement("div");
    card.className = "album-card";
    if(albumSeleccionado && albumSeleccionado.ALBUM_ID === a.ALBUM_ID) card.classList.add("selec");

    const portada = a["PORTADA"];
    card.innerHTML = `
      <div class="cover">${portada ? `<img src="${escapeAttr(portada)}" loading="lazy" alt="">` : escapeHTML(a["ALBUM"]||"")}</div>
      <div class="album-titulo">${escapeHTML(a["ALBUM"]||"(Sin título)")}</div>
      <div class="album-artista">${escapeHTML(a["ARTISTA ALBUM"]||"")}</div>
    `;
    card.addEventListener("click", ()=> abrirDetalle(a));
    grid.appendChild(card);
  });
}

/* ---------- Panel de detalle ---------- */
function abrirDetalle(album){
  albumSeleccionado = album;
  pintarGrid(); // para marcar seleccionado

  $("#det-titulo").textContent = album["ALBUM"] || "(Sin título)";
  $("#det-artista").textContent = album["ARTISTA ALBUM"] || "";

  const portada = album["PORTADA"];
  $("#det-cover").innerHTML = portada
    ? `<img src="${escapeAttr(portada)}" alt="">`
    : escapeHTML(album["ALBUM"] || "Sin carátula");

  const campoOVacio = (valor, sufijo) => valor ? `${escapeHTML(String(valor))}${sufijo||''}` : `<span class="vacio">—</span>`;

  // Año a partir de "Fecha" (puede ser solo el año, o una fecha dd/mm/yyyy)
  const fechaPub = album["Fecha"] ? String(album["Fecha"]) : "";
  const anio = fechaPub.includes("/") ? fechaPub.split("/").pop() : fechaPub;

  $("#det-sello-anio").innerHTML = album["Etiqueta"]
    ? `${escapeHTML(album["Etiqueta"])}${anio ? ` (${escapeHTML(anio)})` : ""}`
    : (anio ? escapeHTML(anio) : '<span class="vacio">—</span>');

  $("#det-genero").innerHTML = campoOVacio(album["GENERO"]);

  const ratingNum = parseInt(album["Rating"]) || 0;
  const estrellasLlenas = Math.round(ratingNum / 2);
  let htmlEstrellas = "";
  for(let i=1;i<=5;i++){
    htmlEstrellas += `<span style="color:${i<=estrellasLlenas ? '#e6c84b':'#4a4d58'}">★</span>`;
  }
  $("#det-badges").innerHTML = `
    <span class="badge-id">#${escapeHTML(String(album["ALBUM_ID"]||""))}</span>
    <span class="badge-rating">${htmlEstrellas} ${ratingNum > 0 ? ratingNum+'/10' : ''}</span>
  `;

  $("#det-catalogo").innerHTML = album["Número de Catalogo"]
    ? `Nº de catálogo: ${escapeHTML(String(album["Número de Catalogo"]))}`
    : "";

  const canciones = CANCIONES
    .filter(c => c.ALBUM_ID === album.ALBUM_ID)
    .sort((a,b)=> (parseInt(a["PISTA Nº"])||0) - (parseInt(b["PISTA Nº"])||0));

  const duracionTotal = album["Total duración"] ? formatearDuracion(album["Total duración"]) : "";
  $("#det-resumen").textContent = `CD · ${canciones.length} pista${canciones.length===1?'':'s'}${duracionTotal ? ' · '+duracionTotal : ''}`;

  const particulares = [
    `<b>Fecha de compra:</b> ${campoOVacio(album["Fecha de compra"])}`,
    `<b>Precio:</b> ${campoOVacio(album["Precio"], " €")}`,
    `<b>Tienda:</b> ${campoOVacio(album["Tienda"])}`,
    `<b>Fecha de publicación:</b> ${fechaPub ? escapeHTML(fechaPub) : '<span class="vacio">—</span>'}`,
  ];
  $("#det-particulares").innerHTML = particulares.join("<br>");

  const ul = $("#canciones");
  ul.innerHTML = "";
  canciones.forEach(c=>{
    const li = document.createElement("li");
    const tieneLetra = c["Letras"] && String(c["Letras"]).trim() !== "";
    li.innerHTML = `
      <span class="num">${escapeHTML(String(c["PISTA Nº"]||""))}</span>
      <span class="tit">${escapeHTML(c["TITULO"]||"")}</span>
      ${tieneLetra ? `<button class="btn-letra" type="button">Letra</button>` : ""}
      <span class="dur">${escapeHTML(formatearDuracion(c["Duración"]))}</span>
    `;
    if(tieneLetra){
      li.querySelector(".btn-letra").addEventListener("click", ()=> abrirLetra(c));
    }
    ul.appendChild(li);
  });

  $("#btn-ficha").style.display = album["Comentario"] ? "inline-block" : "none";

  $("#detalle").classList.add("abierto");
}

function cerrarDetalle(){
  albumSeleccionado = null;
  $("#detalle").classList.remove("abierto");
  pintarGrid();
}

/* ---------- Modal ficha (comentario en Markdown) ---------- */
function abrirFicha(){
  if(!albumSeleccionado) return;
  $("#modal-titulo").textContent = albumSeleccionado["ALBUM"] || "";
  $("#modal-cuerpo").innerHTML = markdownASimpleHTML(albumSeleccionado["Comentario"] || "");
  $("#modal-fondo").classList.add("abierto");
}
function cerrarFicha(){
  $("#modal-fondo").classList.remove("abierto");
}

/* ---------- Modal de letra ---------- */
function abrirLetra(cancion){
  $("#letra-titulo").textContent = cancion["TITULO"] || "";
  $("#letra-subtitulo").textContent = albumSeleccionado ? (albumSeleccionado["ARTISTA ALBUM"] || "") : "";
  $("#letra-cuerpo").innerHTML = markdownASimpleHTML(cancion["Letras"] || "");
  $("#modal-fondo-letra").classList.add("abierto");
}
function cerrarLetra(){
  $("#modal-fondo-letra").classList.remove("abierto");
}

/* Conversor Markdown -> HTML muy simple, sin dependencias externas.
   Soporta: # ## ### encabezados, **negrita**, *cursiva*, listas con "- ",
   imágenes ![alt](url), enlaces [texto](url), párrafos. */
function markdownASimpleHTML(md){
  if(!md) return "";
  const lineas = md.split("\n");
  let html = "";
  let enLista = false;

  lineas.forEach(linea=>{
    let l = linea.trim();

    if(l === ""){
      if(enLista){ html += "</ul>"; enLista = false; }
      return;
    }

    const encabezado = l.match(/^(#{1,3})\s+(.*)/);
    if(encabezado){
      if(enLista){ html += "</ul>"; enLista = false; }
      const nivel = encabezado[1].length + 2; // #->h3, ##->h4, ###->h5
      html += `<h${nivel}>${inlineMD(encabezado[2])}</h${nivel}>`;
      return;
    }

    if(l.startsWith("- ")){
      if(!enLista){ html += "<ul>"; enLista = true; }
      html += `<li>${inlineMD(l.slice(2))}</li>`;
      return;
    }

    if(enLista){ html += "</ul>"; enLista = false; }
    html += `<p>${inlineMD(l)}</p>`;
  });
  if(enLista) html += "</ul>";
  return html;
}
function inlineMD(texto){
  let t = escapeHTML(texto);
  t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m,alt,url)=>`<img src="${url}" alt="${alt}">`);
  t = t.replace(/\[([^\]]*)\]\(([^)]+)\)/g, (m,txt,url)=>`<a href="${url}" target="_blank" rel="noopener">${txt}</a>`);
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return t;
}

/* ---------- Utilidades ---------- */
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){ return escapeHTML(s); }
function formatearDuracion(v){
  if(!v) return "";
  // El script ya envía "HH:mm:ss"; si la hora es 00, la recortamos (ej. "00:04:33" -> "04:33")
  const m = String(v).match(/^00:(\d{2}:\d{2})$/);
  return m ? m[1] : String(v);
}

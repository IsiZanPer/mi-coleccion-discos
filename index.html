<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi colección de discos — Acceso</title>
<style>
  :root{
    --bg:#14151a;
    --panel:#1c1e26;
    --panel-hi:#21242e;
    --border:#2c2f3a;
    --text:#ece9e2;
    --muted:#8c8fa0;
    --accent:#c99a3c;
    --accent-dim:#8a6d2c;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  }
  .login-caja{
    width:100%;
    max-width:340px;
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:10px;
    padding:28px 26px;
  }
  .login-caja h1{
    font-size:17px;
    margin:0 0 22px;
    text-align:center;
    color:var(--text);
  }
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:14px;
  }
  label span{display:block;margin-bottom:5px;}
  input{
    width:100%;
    background:var(--panel-hi);
    border:1px solid var(--border);
    color:var(--text);
    padding:9px 10px;
    border-radius:6px;
    font-size:14px;
    font-family:inherit;
  }
  input:focus{outline:none;border-color:var(--accent);}
  button{
    width:100%;
    background:var(--accent);
    border:none;
    color:#14151a;
    font-weight:600;
    padding:10px;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    font-family:inherit;
    margin-top:4px;
  }
  button:hover{background:var(--accent-dim);}
  button:disabled{opacity:.6;cursor:default;}
  #login-error{
    color:#d97070;
    font-size:12.5px;
    min-height:16px;
    margin:10px 0 0;
    text-align:center;
  }
</style>
</head>
<body>

<div class="login-caja">
  <h1>🎵 Mi colección de discos</h1>
  <label>
    <span>Usuario</span>
    <input type="text" id="login-usuario" autocomplete="username">
  </label>
  <label>
    <span>Contraseña</span>
    <input type="password" id="login-password" autocomplete="current-password">
  </label>
  <button type="button" id="btn-entrar">Entrar</button>
  <p id="login-error"></p>
</div>

<script>
/* Misma URL /exec que usa BDD.html */
const API_URL = "https://script.google.com/macros/s/AKfycbwjBPSQzS1HUC4fAl21wSonBf2qe5iNHLi8n-JVyQCt6VISRDpV-_VcUZM-se_Zabg2/exec";

const inputUsuario = document.getElementById("login-usuario");
const inputPassword = document.getElementById("login-password");
const elError = document.getElementById("login-error");
const btn = document.getElementById("btn-entrar");

// Si ya hay una sesión guardada en esta pestaña, no hace falta pasar por aquí
if(sessionStorage.getItem("sesion_discos")){
  location.href = "BDD.html";
}

btn.addEventListener("click", intentarLogin);
inputPassword.addEventListener("keydown", e=>{ if(e.key==="Enter") intentarLogin(); });
inputUsuario.addEventListener("keydown", e=>{ if(e.key==="Enter") intentarLogin(); });

async function intentarLogin(){
  const usuario = inputUsuario.value.trim();
  const password = inputPassword.value;
  elError.textContent = "";

  if(!usuario || !password){
    elError.textContent = "Rellena usuario y contraseña.";
    return;
  }

  btn.disabled = true;
  btn.textContent = "Entrando…";

  try{
    const res = await fetch(API_URL, {
      method: "POST",
      // Sin Content-Type explícito a propósito: así el navegador lo manda
      // como "text/plain", lo que evita un preflight OPTIONS que Apps
      // Script no sabe responder (mismo motivo que en BDD.html).
      body: JSON.stringify({ accion: "login", usuario, password })
    });
    const json = await res.json();

    if(!json.ok){
      elError.textContent = json.error || "No se pudo iniciar sesión.";
      btn.disabled = false;
      btn.textContent = "Entrar";
      return;
    }

    sessionStorage.setItem("sesion_discos", json.sesion);
    sessionStorage.setItem("usuario_discos", json.usuario);
    location.href = "BDD.html";
  }catch(err){
    elError.textContent = "No se pudo conectar.";
    btn.disabled = false;
    btn.textContent = "Entrar";
    console.error(err);
  }
}
</script>
</body>
</html>

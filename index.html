<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi colección</title>
<style>
  :root{
    --bg:#14151a;
    --panel:#1c1e26;
    --panel-hi:#21242e;
    --border:#2c2f3a;
    --text:#ece9e2;
    --muted:#8c8fa0;
    --accent:#c99a3c;
    --accent-dim:#8a6d2c;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
    font-size:14px;
    display:flex;
    flex-direction:column;
    height:100vh;
    overflow:hidden;
  }
  h1,h2,h3,.serif{
    font-family:Fraunces,Georgia,serif;
    font-weight:600;
  }

  /* ---------- Barra superior ---------- */
  header{
    display:flex;
    align-items:center;
    gap:16px;
    padding:12px 20px;
    border-bottom:1px solid var(--border);
    background:var(--panel);
    flex-shrink:0;
  }
  header h1{
    font-size:20px;
    margin:0;
    color:var(--accent);
    white-space:nowrap;
  }
  #buscador{
    flex:1;
    max-width:420px;
    background:var(--bg);
    border:1px solid var(--border);
    color:var(--text);
    padding:8px 12px;
    border-radius:4px;
    font-size:14px;
  }
  #buscador:focus{outline:none;border-color:var(--accent);}
  #contador{color:var(--muted);white-space:nowrap;}
  #estado-carga{color:var(--muted);font-size:13px;}

  /* ---------- Cuerpo: 3 columnas ---------- */
  #cuerpo{
    flex:1;
    display:flex;
    min-height:0;
  }

  /* --- Sidebar artistas --- */
  #sidebar{
    width:220px;
    flex-shrink:0;
    border-right:1px solid var(--border);
    background:var(--panel);
    overflow-y:auto;
    padding:8px 0;
  }
  .artista-item{
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding:6px 16px;
    cursor:pointer;
    color:var(--muted);
  }
  .artista-item:hover{background:var(--panel-hi);color:var(--text);}
  .artista-item.activo{background:var(--panel-hi);color:var(--accent);font-weight:600;}
  .artista-item .n{opacity:.6;font-variant-numeric:tabular-nums;}

  /* --- Grid álbumes --- */
  #grid-wrap{
    flex:1;
    overflow-y:auto;
    padding:20px;
  }
  #grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(160px,1fr));
    gap:18px;
  }
  .album-card{
    cursor:pointer;
    display:flex;
    flex-direction:column;
    gap:6px;
  }
  .cover{
    width:100%;
    aspect-ratio:1/1;
    background:var(--panel-hi) linear-gradient(135deg,#2a2d38,#1a1c23);
    border:1px solid var(--border);
    border-radius:4px;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    color:var(--muted);
    font-size:11px;
    text-align:center;
    padding:8px;
  }
  .cover img{width:100%;height:100%;object-fit:cover;display:block;}
  .album-card.selec .cover{outline:2px solid var(--accent);outline-offset:2px;}
  .album-titulo{font-size:13px;font-weight:600;line-height:1.3;}
  .album-artista{font-size:12px;color:var(--muted);}

  #vacio{color:var(--muted);padding:40px;text-align:center;}

  /* --- Panel detalle --- */
  #detalle{
    width:380px;
    flex-shrink:0;
    border-left:1px solid var(--border);
    background:var(--panel);
    overflow-y:auto;
    padding:20px;
    display:none;
  }
  #detalle.abierto{display:block;}
  #detalle .cover-grande{
    width:100%;
    aspect-ratio:1/1;
    background:var(--panel-hi);
    border:1px solid var(--border);
    border-radius:4px;
    overflow:hidden;
    margin-bottom:14px;
  }
  #detalle .cover-grande img{width:100%;height:100%;object-fit:cover;}
  #detalle h2{font-size:22px;margin:0 0 2px;}
  #detalle .artista-det{color:var(--accent);font-size:15px;margin-bottom:10px;}
  #detalle .meta{color:var(--muted);font-size:12.5px;line-height:1.7;margin-bottom:14px;}
  #detalle .meta b{color:var(--text);font-weight:500;}
  #rating-det{color:var(--accent);letter-spacing:2px;font-size:15px;margin-bottom:14px;}

  .cerrar-detalle{
    float:right;
    cursor:pointer;
    color:var(--muted);
    font-size:20px;
    line-height:1;
  }
  .cerrar-detalle:hover{color:var(--text);}

  #canciones{list-style:none;margin:0 0 16px;padding:0;border-top:1px solid var(--border);}
  #canciones li{
    display:flex;
    justify-content:space-between;
    gap:8px;
    padding:7px 0;
    border-bottom:1px solid var(--border);
    font-size:13px;
  }
  #canciones .num{color:var(--muted);width:22px;flex-shrink:0;}
  #canciones .tit{flex:1;}
  #canciones .dur{color:var(--muted);font-variant-numeric:tabular-nums;}

  .btn-ficha{
    display:inline-block;
    background:transparent;
    border:1px solid var(--accent-dim);
    color:var(--accent);
    padding:8px 14px;
    border-radius:4px;
    cursor:pointer;
    font-size:13px;
    font-family:inherit;
  }
  .btn-ficha:hover{background:var(--accent);color:#14151a;}

  /* --- Modal ficha (comentario en modo lectura) --- */
  #modal-fondo{
    display:none;
    position:fixed;inset:0;
    background:rgba(0,0,0,.6);
    z-index:50;
    align-items:center;
    justify-content:center;
  }
  #modal-fondo.abierto{display:flex;}
  #modal-ficha{
    background:#19171380;
    background:#1a1913;
    background-color:#1b1a15;
    background-image:linear-gradient(#1c1b16,#1c1b16);
    color:#e9e4d8;
    width:min(680px,90vw);
    max-height:85vh;
    overflow-y:auto;
    padding:40px 48px;
    border-radius:6px;
    font-family:Fraunces,Georgia,serif;
    font-size:17px;
    line-height:1.75;
  }
  #modal-ficha h3{margin-top:0;font-size:26px;}
  #modal-ficha img{max-width:100%;border-radius:4px;margin:12px 0;}
  #modal-ficha .cerrar-detalle{color:#8c8776;}

  /* Scrollbars discretas */
  ::-webkit-scrollbar{width:10px;}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  @media (max-width:820px){
    #sidebar{position:fixed;left:0;top:53px;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .2s;}
    #sidebar.abierto{transform:translateX(0);}
    #detalle{position:fixed;right:0;top:53px;bottom:0;width:100%;z-index:30;}
  }
</style>
</head>
<body>

<header>
  <h1>Mi colección</h1>
  <input id="buscador" type="text" placeholder="Buscar por álbum o artista…">
  <span id="contador"></span>
  <span id="estado-carga">Cargando datos…</span>
</header>

<div id="cuerpo">
  <nav id="sidebar">
    <div class="artista-item activo" data-artista="__TODOS__">
      <span>Todos</span><span class="n" id="n-todos"></span>
    </div>
    <div id="lista-artistas"></div>
  </nav>

  <div id="grid-wrap">
    <div id="grid"></div>
    <div id="vacio" style="display:none;">No se han encontrado álbumes.</div>
  </div>

  <aside id="detalle">
    <span class="cerrar-detalle" id="cerrar-detalle">✕</span>
    <div class="cover-grande" id="det-cover"></div>
    <h2 id="det-titulo"></h2>
    <div class="artista-det" id="det-artista"></div>
    <div id="rating-det"></div>
    <div class="meta" id="det-meta"></div>
    <ol id="canciones"></ol>
    <button class="btn-ficha" id="btn-ficha">Ver ficha completa</button>
  </aside>
</div>

<div id="modal-fondo">
  <div id="modal-ficha">
    <span class="cerrar-detalle" id="cerrar-modal">✕</span>
    <h3 id="modal-titulo"></h3>
    <div id="modal-cuerpo"></div>
  </div>
</div>

<script>
/* =========================================================
   CONFIGURACIÓN — pega aquí la URL /exec de tu Apps Script
   ========================================================= */
const API_URL = "https://script.google.com/macros/s/AKfycbwjBPSQzS1HUC4fAl21wSonBf2qe5iNHLi8n-JVyQCt6VISRDpV-_VcUZM-se_Zabg2/exec";

let ALBUMES = [];
let CANCIONES = [];
let artistaActivo = "__TODOS__";
let albumSeleccionado = null;

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));

/* ---------- Carga de datos ---------- */
async function cargarDatos(){
  try{
    const res = await fetch(API_URL);
    const json = await res.json();
    if(!json.ok){
      $("#estado-carga").textContent = "Error: " + json.error;
      return;
    }
    ALBUMES = json.albumes;
    CANCIONES = json.canciones;
    $("#estado-carga").textContent = "";
    construirSidebar();
    pintarGrid();
  }catch(err){
    $("#estado-carga").textContent = "No se pudo conectar con la hoja de datos.";
    console.error(err);
  }
}

/* ---------- Sidebar de artistas ---------- */
function construirSidebar(){
  const conteo = {};
  ALBUMES.forEach(a=>{
    const nombre = (a["ARTISTA ALBUM"]||"(Sin artista)").trim();
    conteo[nombre] = (conteo[nombre]||0)+1;
  });
  const artistas = Object.keys(conteo).sort((a,b)=>a.localeCompare(b,'es'));

  $("#n-todos").textContent = ALBUMES.length;

  const cont = $("#lista-artistas");
  cont.innerHTML = "";
  artistas.forEach(nombre=>{
    const div = document.createElement("div");
    div.className = "artista-item";
    div.dataset.artista = nombre;
    div.innerHTML = `<span>${escapeHTML(nombre)}</span><span class="n">${conteo[nombre]}</span>`;
    div.addEventListener("click", ()=>{
      artistaActivo = nombre;
      $$(".artista-item").forEach(el=>el.classList.remove("activo"));
      div.classList.add("activo");
      pintarGrid();
    });
    cont.appendChild(div);
  });

  $('.artista-item[data-artista="__TODOS__"]').addEventListener("click", ()=>{
    artistaActivo = "__TODOS__";
    $$(".artista-item").forEach(el=>el.classList.remove("activo"));
    $('.artista-item[data-artista="__TODOS__"]').classList.add("activo");
    pintarGrid();
  });
}

/* ---------- Grid de álbumes ---------- */
function pintarGrid(){
  const texto = $("#buscador").value.trim().toLowerCase();

  let lista = ALBUMES.filter(a=>{
    const okArtista = artistaActivo === "__TODOS__" || (a["ARTISTA ALBUM"]||"").trim() === artistaActivo;
    if(!okArtista) return false;
    if(!texto) return true;
    const campo = ((a["ALBUM"]||"") + " " + (a["ARTISTA ALBUM"]||"")).toLowerCase();
    return campo.includes(texto);
  });

  lista.sort((a,b)=> (a["ALBUM"]||"").localeCompare(b["ALBUM"]||"", 'es'));

  $("#contador").textContent = lista.length + (lista.length===1 ? " álbum" : " álbumes");

  const grid = $("#grid");
  grid.innerHTML = "";
  $("#vacio").style.display = lista.length ? "none" : "block";

  lista.forEach(a=>{
    const card = document.createElement("div");
    card.className = "album-card";
    if(albumSeleccionado && albumSeleccionado.ALBUM_ID === a.ALBUM_ID) card.classList.add("selec");

    const portada = a["PORTADA"];
    card.innerHTML = `
      <div class="cover">${portada ? `<img src="${escapeAttr(portada)}" loading="lazy" alt="">` : escapeHTML(a["ALBUM"]||"")}</div>
      <div class="album-titulo">${escapeHTML(a["ALBUM"]||"(Sin título)")}</div>
      <div class="album-artista">${escapeHTML(a["ARTISTA ALBUM"]||"")}</div>
    `;
    card.addEventListener("click", ()=> abrirDetalle(a));
    grid.appendChild(card);
  });
}

/* ---------- Panel de detalle ---------- */
function abrirDetalle(album){
  albumSeleccionado = album;
  pintarGrid(); // para marcar seleccionado

  $("#det-titulo").textContent = album["ALBUM"] || "(Sin título)";
  $("#det-artista").textContent = album["ARTISTA ALBUM"] || "";

  const portada = album["PORTADA"];
  $("#det-cover").innerHTML = portada ? `<img src="${escapeAttr(portada)}" alt="">` : "";

  const rating = parseInt(album["Rating"]) || 0;
  $("#rating-det").textContent = rating > 0 ? "★".repeat(rating) + "☆".repeat(Math.max(0,10-rating)) : "";

  const meta = [];
  if(album["GENERO"]) meta.push(`<b>Género:</b> ${escapeHTML(album["GENERO"])}`);
  if(album["Fecha"]) meta.push(`<b>Año:</b> ${escapeHTML(String(album["Fecha"]))}`);
  if(album["Etiqueta"]) meta.push(`<b>Sello:</b> ${escapeHTML(album["Etiqueta"])}`);
  if(album["Número de Catalogo"]) meta.push(`<b>Catálogo:</b> ${escapeHTML(album["Número de Catalogo"])}`);
  if(album["Total duración"]) meta.push(`<b>Duración:</b> ${escapeHTML(String(album["Total duración"]))}`);
  if(album["Fecha de compra"]) meta.push(`<b>Comprado:</b> ${escapeHTML(String(album["Fecha de compra"]))}${album["Precio"] ? " · " + escapeHTML(String(album["Precio"])) + "€" : ""}${album["Tienda"] ? " · " + escapeHTML(album["Tienda"]) : ""}`);
  $("#det-meta").innerHTML = meta.join("<br>");

  const canciones = CANCIONES
    .filter(c => c.ALBUM_ID === album.ALBUM_ID)
    .sort((a,b)=> (parseInt(a["PISTA Nº"])||0) - (parseInt(b["PISTA Nº"])||0));

  const ul = $("#canciones");
  ul.innerHTML = "";
  canciones.forEach(c=>{
    const li = document.createElement("li");
    li.innerHTML = `
      <span class="num">${escapeHTML(String(c["PISTA Nº"]||""))}</span>
      <span class="tit">${escapeHTML(c["TITULO"]||"")}</span>
      <span class="dur">${escapeHTML(formatearDuracion(c["Duración"]))}</span>
    `;
    ul.appendChild(li);
  });

  $("#btn-ficha").style.display = album["Comentario"] ? "inline-block" : "none";

  $("#detalle").classList.add("abierto");
}

function cerrarDetalle(){
  albumSeleccionado = null;
  $("#detalle").classList.remove("abierto");
  pintarGrid();
}

/* ---------- Modal ficha (comentario en Markdown) ---------- */
function abrirFicha(){
  if(!albumSeleccionado) return;
  $("#modal-titulo").textContent = albumSeleccionado["ALBUM"] || "";
  $("#modal-cuerpo").innerHTML = markdownASimpleHTML(albumSeleccionado["Comentario"] || "");
  $("#modal-fondo").classList.add("abierto");
}
function cerrarFicha(){
  $("#modal-fondo").classList.remove("abierto");
}

/* Conversor Markdown -> HTML muy simple, sin dependencias externas.
   Soporta: # ## ### encabezados, **negrita**, *cursiva*, listas con "- ",
   imágenes ![alt](url), enlaces [texto](url), párrafos. */
function markdownASimpleHTML(md){
  if(!md) return "";
  const lineas = md.split("\n");
  let html = "";
  let enLista = false;

  lineas.forEach(linea=>{
    let l = linea.trim();

    if(l === ""){
      if(enLista){ html += "</ul>"; enLista = false; }
      return;
    }

    const encabezado = l.match(/^(#{1,3})\s+(.*)/);
    if(encabezado){
      if(enLista){ html += "</ul>"; enLista = false; }
      const nivel = encabezado[1].length + 2; // #->h3, ##->h4, ###->h5
      html += `<h${nivel}>${inlineMD(encabezado[2])}</h${nivel}>`;
      return;
    }

    if(l.startsWith("- ")){
      if(!enLista){ html += "<ul>"; enLista = true; }
      html += `<li>${inlineMD(l.slice(2))}</li>`;
      return;
    }

    if(enLista){ html += "</ul>"; enLista = false; }
    html += `<p>${inlineMD(l)}</p>`;
  });
  if(enLista) html += "</ul>";
  return html;
}
function inlineMD(texto){
  let t = escapeHTML(texto);
  t = t.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, (m,alt,url)=>`<img src="${url}" alt="${alt}">`);
  t = t.replace(/\[([^\]]*)\]\(([^)]+)\)/g, (m,txt,url)=>`<a href="${url}" target="_blank" rel="noopener">${txt}</a>`);
  t = t.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  t = t.replace(/\*([^*]+)\*/g, "<em>$1</em>");
  return t;
}

/* ---------- Utilidades ---------- */
function escapeHTML(s){
  return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function escapeAttr(s){ return escapeHTML(s); }
function formatearDuracion(v){
  if(!v) return "";
  if(typeof v === "string" && v.includes(":")) return v.split(":").slice(0,2).join(":").padStart(4,"0");
  return String(v);
}

/* ---------- Eventos ---------- */
$("#buscador").addEventListener("input", pintarGrid);
$("#cerrar-detalle").addEventListener("click", cerrarDetalle);
$("#btn-ficha").addEventListener("click", abrirFicha);
$("#cerrar-modal").addEventListener("click", cerrarFicha);
$("#modal-fondo").addEventListener("click", (e)=>{ if(e.target.id==="modal-fondo") cerrarFicha(); });

cargarDatos();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Colecci贸n de Discos - Acceso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #1e3c72;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-weight: 600;
            color: #333;
            font-size: 14px;
        }

        input {
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #2a5298;
        }

        .btn-login {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            color: white;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(30, 60, 114, 0.4);
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .error-msg {
            color: #d32f2f;
            text-align: center;
            font-size: 14px;
            display: none;
        }

        .version-selector {
            display: none;
            flex-direction: column;
            gap: 30px;
        }

        .version-selector.active {
            display: flex;
        }

        .welcome-msg {
            text-align: center;
            color: #666;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .version-cards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .version-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            border-radius: 15px;
            padding: 30px 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            text-decoration: none;
            color: #333;
        }

        .version-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .version-card.old {
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
        }

        .version-card.new {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
        }

        .version-icon {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .version-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .version-desc {
            font-size: 13px;
            color: #666;
        }

        .logout-btn {
            background: #f44336;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 20px;
            transition: background 0.3s;
        }

        .logout-btn:hover {
            background: #d32f2f;
        }

        @media (max-width: 480px) {
            .version-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>馃幍 Mi Colecci贸n de Discos</h1>
        
        <!-- Formulario de Login -->
        <div id="loginSection" class="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" placeholder="Introduce tu usuario" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="password">Contrase帽a</label>
                <input type="password" id="password" placeholder="Introduce tu contrase帽a" autocomplete="current-password">
            </div>
            <div id="errorMsg" class="error-msg">Usuario o contrase帽a incorrectos</div>
            <button class="btn-login" onclick="handleLogin()">Entrar</button>
        </div>

        <!-- Selector de Versi贸n -->
        <div id="versionSection" class="version-selector">
            <p class="welcome-msg">Bienvenido, <span id="welcomeUser"></span></p>
            <div class="version-cards">
                <a href="OLD.html" class="version-card old">
                    <div class="version-icon">馃搥</div>
                    <div class="version-title">Versi贸n Antigua</div>
                    <div class="version-desc">Versi贸n estable actual</div>
                </a>
                <a href="NEW.html" class="version-card new">
                    <div class="version-icon">鉁?/div>
                    <div class="version-title">Versi贸n Nueva</div>
                    <div class="version-desc">En desarrollo</div>
                </a>
            </div>
            <button class="logout-btn" onclick="handleLogout()">Cerrar sesi贸n</button>
        </div>
    </div>

    <script>
    // URL de tu Google Apps Script
    const API_URL = 'https://script.google.com/macros/s/AKfycbwjBPSQzS1HUC4fAl21wSonBf2qe5iNHLi8n-JVyQCt6VISRDpV-_VcUZM-se_Zabg2/exec';

    // Verificar si ya hay sesión activa
    window.addEventListener('DOMContentLoaded', () => {
        const sesionActiva = sessionStorage.getItem('sesionActiva');
        if (sesionActiva === 'true') {
            mostrarSelectorVersion();
        }
    });

    async function handleLogin() {
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const errorMsg = document.getElementById('errorMsg');
        const btnLogin = document.querySelector('.btn-login');

        if (!username || !password) {
            errorMsg.textContent = 'Por favor, completa todos los campos';
            errorMsg.style.display = 'block';
            setTimeout(() => errorMsg.style.display = 'none', 3000);
            return;
        }

        // Deshabilitar botón mientras se valida
        btnLogin.disabled = true;
        btnLogin.textContent = 'Validando...';

        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                mode: 'cors',
                headers: {
                    'Content-Type': 'text/plain;charset=utf-8',
                },
                body: JSON.stringify({
                    accion: 'login',
                    usuario: username,
                    password: password
                })
            });

            const data = await response.json();

            if (data.ok) {
                // Login exitoso
                sessionStorage.setItem('sesionActiva', 'true');
                sessionStorage.setItem('usuario', data.usuario);
                sessionStorage.setItem('token', data.token);
                mostrarSelectorVersion();
            } else {
                // Login fallido
                errorMsg.textContent = data.error || 'Usuario o contrase?a incorrectos';
                errorMsg.style.display = 'block';
                setTimeout(() => errorMsg.style.display = 'none', 3000);
            }
        } catch (err) {
            errorMsg.textContent = 'Error de conexión. Inténtalo de nuevo.';
            errorMsg.style.display = 'block';
            setTimeout(() => errorMsg.style.display = 'none', 3000);
        } finally {
            btnLogin.disabled = false;
            btnLogin.textContent = 'Entrar';
        }
    }

    function mostrarSelectorVersion() {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('versionSection').classList.add('active');
        document.getElementById('welcomeUser').textContent = sessionStorage.getItem('usuario') || 'usuario';
    }

    function handleLogout() {
        sessionStorage.removeItem('sesionActiva');
        sessionStorage.removeItem('usuario');
        sessionStorage.removeItem('token');
        document.getElementById('loginSection').style.display = 'flex';
        document.getElementById('versionSection').classList.remove('active');
        document.getElementById('username').value = '';
        document.getElementById('password').value = '';
    }

    // Permitir login con Enter
    document.getElementById('password').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
            handleLogin();
        }
    });
</script>
</body>
</html>
